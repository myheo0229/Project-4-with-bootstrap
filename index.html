        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <!-- bootstrap style -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"

        <!-- my style -->

    <body>
        <!-- navbar -->
        <nav class="navbar navbar-expand-lg bg-light border small border-bottom">
            <div class="container">
                <a class="navbar-brand" href="#">
                    <img src="./img/logo-tuhoc-light.png" alt="Logo website Tuhoc.cc" width="30" height="24" />
                </a>
                <button
                    class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent"
                    aria-controls="navbarSupportedContent"
                    aria-expanded="false"
                    aria-label="Toggle navigation"
                >
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">

                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                            <a class="nav-link active" aria-current="page" href="#">Home</a>

                        <li class="nav-item">
                            <a class="nav-link" href="#">About</a>

                        <li class="nav-item">

                        <li class="nav-item">

                                viewBox="0 0 640 640"

                            class="btn btn-warning btn-sm d-inline-flex justify-content-center align-items-center me-1"
                        >
                            <svg
                                class="me-1"
                                xmlns="http://www.w3.org/2000/svg"
                                viewBox="0 0 640 640"
                                width="16px"
                                height="16px"
                            >

                    <!-- form search -->
                    <form class="d-flex" role="search">
                        <input class="form-control" type="search" placeholder="Search" aria-label="Search" />
                        <button class="btn bg-success text-white" type="submit">
                            <img src="./img/search.svg" alt="search" width="16px" height="16px" />
                        </button>
                    </form>
                </div>
            </div>
        </nav>

        <!-- Nhúng js bootstrap -->
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
